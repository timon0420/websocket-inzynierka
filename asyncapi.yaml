asyncapi: 3.0.0
info:
  title: Session Manipulator Streaming API
  version: 4.0.0
  description: Izolowany transport browser-Python-Unity dla wielu sesji.
servers:
  local:
    host: localhost:8080
    protocol: ws
  production:
    host: websocket-inzynierka.onrender.com
    protocol: wss
channels:
  browser:
    address: /ws/browser?token={token}
    messages:
      jpegFrame:
        $ref: '#/components/messages/JpegFrame'
      status:
        $ref: '#/components/messages/Status'
      analysis:
        $ref: '#/components/messages/Analysis'
  python:
    address: /ws/python?token={token}
    messages:
      jpegFrame:
        $ref: '#/components/messages/JpegFrame'
      analysis:
        $ref: '#/components/messages/Analysis'
  unity:
    address: /ws/unity?token={token}
    messages:
      angles:
        $ref: '#/components/messages/Angles'
operations:
  browserSendsJPEG:
    action: send
    channel: { $ref: '#/channels/browser' }
    messages:
      - { $ref: '#/channels/browser/messages/jpegFrame' }
  pythonReceivesJPEG:
    action: receive
    channel: { $ref: '#/channels/python' }
    messages:
      - { $ref: '#/channels/python/messages/jpegFrame' }
  pythonSendsAnalysis:
    action: send
    channel: { $ref: '#/channels/python' }
    messages:
      - { $ref: '#/channels/python/messages/analysis' }
  browserReceivesAnalysis:
    action: receive
    channel: { $ref: '#/channels/browser' }
    messages:
      - { $ref: '#/channels/browser/messages/analysis' }
      - { $ref: '#/channels/browser/messages/status' }
  unityReceivesAngles:
    action: receive
    channel: { $ref: '#/channels/unity' }
    messages:
      - { $ref: '#/channels/unity/messages/angles' }
components:
  messages:
    JpegFrame:
      name: JpegFrame
      contentType: image/jpeg
      payload:
        type: string
        format: binary
        maxLength: 204800
    Analysis:
      name: Analysis
      contentType: application/json
      payload: { $ref: '#/components/schemas/AnalysisPayload' }
    Angles:
      name: Angles
      contentType: application/json
      payload: { $ref: '#/components/schemas/AnglesPayload' }
    Status:
      name: Status
      contentType: application/json
      payload:
        type: object
        required: [type, analysis, python, unity]
        properties:
          type: { const: status }
          analysis: { enum: [ready, unavailable] }
          analysisError: { type: string }
          python: { type: boolean }
          unity: { type: boolean }
  schemas:
    AnalysisPayload:
      type: object
      required: [type, detected, processingMs]
      properties:
        type: { const: analysis }
        detected: { type: boolean }
        angles:
          type: array
          minItems: 6
          maxItems: 6
          items: { type: number, minimum: 0, maximum: 180 }
        processingMs: { type: number, minimum: 0 }
        sequence: { type: integer, minimum: 0 }
    AnglesPayload:
      type: object
      required: [type, angles, timestamp, sequence]
      properties:
        type: { const: angles }
        angles:
          type: array
          minItems: 6
          maxItems: 6
          items: { type: number, minimum: 0, maximum: 180 }
        timestamp: { type: number }
        sequence: { type: integer, minimum: 1 }
